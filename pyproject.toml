[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mtg-ai"
version = "0.1.0"
description = "LLM benchmark harness for MTG puzzles"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "tenacity>=8.2.0",
]

[project.scripts]
bench = "harness.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["harness*", "benchmarks*"]
