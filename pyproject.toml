[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mtg-ai"
version = "0.1.0"
description = "Constrained MTG rules engine and bot training framework"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
mtg-cli = "mtg_ai.interfaces.cli:main"
mtg-replay = "mtg_ai.replay.replay_cli:main"
mtg-gauntlet = "mtg_ai.eval.scenarios:main"
mtg-generalization = "mtg_ai.eval.generalization:main"
mtg-train = "mtg_ai.training.self_play:main"
mtg-train-sweep = "mtg_ai.training.hyperparam_sweep:main"
mtg-deck-search = "mtg_ai.deck.search:main"
mtg-report = "mtg_ai.analysis.report:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
