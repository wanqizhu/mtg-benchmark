[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mtg-ai"
version = "0.1.0"
description = "Constrained MTG rules engine and bot training framework"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
mtg-cli = "mtg_ai.interfaces.cli:main"
mtg-replay = "mtg_ai.replay.replay_cli:main"
mtg-gauntlet = "mtg_ai.eval.scenarios:main"
mtg-generalization = "mtg_ai.eval.generalization:main"
mtg-deck-validate = "mtg_ai.eval.deck_validation:main"
mtg-policy-select = "mtg_ai.eval.policy_selection:main"
mtg-milestones = "mtg_ai.eval.milestones:main"
mtg-convergence = "mtg_ai.eval.convergence:main"
mtg-champion = "mtg_ai.eval.champion:main"
mtg-significance = "mtg_ai.eval.significance:main"
mtg-replay-samples = "mtg_ai.eval.replay_samples:main"
mtg-full-pipeline = "mtg_ai.eval.full_pipeline:main"
mtg-train = "mtg_ai.training.self_play:main"
mtg-train-sweep = "mtg_ai.training.hyperparam_sweep:main"
mtg-solver-tune = "mtg_ai.training.solver_tune:main"
mtg-deck-search = "mtg_ai.deck.search:main"
mtg-report = "mtg_ai.analysis.report:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
