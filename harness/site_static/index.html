<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MTG Puzzle Bench</title>
    <link rel="stylesheet" href="styles.css?v=8">
  </head>
  <body>
    <header class="topbar">
      <div>
        <p class="eyebrow">MTG Puzzle Bench</p>
        <p class="subtitle">Puzzles from <a class="title-link" href="https://www.patreon.com/mtgpuzzles" target="_blank" rel="noopener noreferrer">Possibility Storm</a></p>
      </div>
      <div class="topbar-controls">
        <label class="run-picker">
          <span>Version</span>
          <select id="run-select"></select>
        </label>
        <nav>
          <button class="nav-button active" data-view="leaderboard">Leaderboard</button>
          <button class="nav-button" data-view="problems">Problems</button>
          <button class="nav-button" data-view="models">Models</button>
        </nav>
      </div>
    </header>
    <main id="app" class="shell"></main>
    <div id="lightbox" class="lightbox" hidden>
      <button type="button" class="lightbox-close" aria-label="Close">Close</button>
      <img id="lightbox-image" alt="">
    </div>
    <script src="app.js?v=8"></script>
  </body>
</html>
