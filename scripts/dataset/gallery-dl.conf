{
    "extractor": {
        "patreon": {
            "directory": ["{creator[full_name]}", "{title}"],
            "filename": "{num:>02}_{filename}.{extension}",
            "format-images": "download_url",
            "files": ["images", "image_large", "attachments", "postfile", "content"],
            "postprocessors": [{
                "name": "metadata",
                "event": "post",
                "filename": "{title}.txt",
                "mode": "custom",
                "format": "Title: {title}\nDate: {published}\nURL: {post_url}\n\n{content}"
            }]
        }
    }
}
